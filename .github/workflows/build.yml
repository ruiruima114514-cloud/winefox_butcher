name: Build Mod

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download dependencies
        shell: bash
        run: |
          mkdir -p libs
          curl -fL --retry 3 \
            'https://cdn.modrinth.com/data/R0bDWFAW/versions/g1SKoGQJ/touhoulittlemaid-1.5.3-forge%2Bmc1.20.1.jar' \
            -o libs/touhoulittlemaid-1.5.3.jar
          curl -fL --retry 3 \
            'https://cdn.modrinth.com/data/MT2Xm0ih/versions/Ef6GKQqY/butchercraft-2.4.1.jar' \
            -o libs/butchercraft-2.4.1.jar
          curl -fL --retry 3 \
            'https://cdn.modrinth.com/data/R2OftAxM/versions/CsjS7EkP/FarmersDelight-1.20.1-1.3.2.jar' \
            -o libs/farmersdelight-1.3.2.jar

      - name: Adjust Butchercraft dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.gradle")
          text = p.read_text()
          old = 'implementation "butchercraft:butchercraft:${butchercraft_version}"'
          new = 'implementation fg.deobf("butchercraft:butchercraft:${butchercraft_version}")'
          p.write_text(text.replace(old, new))
          PY

      - name: Build
        run: bash gradlew build --no-daemon --console=plain --stacktrace

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: winefox-butcher-jar
          path: build/libs/*.jar
          if-no-files-found: error
